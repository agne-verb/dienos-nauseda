<!doctype html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Gitano Nausėdos citatų karuselė" />
  <title>Nausėdos citatų karuselė</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050505;
      color: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.08), transparent 30rem),
        radial-gradient(circle at bottom right, rgba(255,255,255,0.06), transparent 26rem),
        #050505;
    }
    button, a { -webkit-tap-highlight-color: transparent; }

    .page-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .content-wrap { width: min(100%, 72rem); }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
      color: #a3a3a3;
    }
    .eyebrow {
      margin: 0;
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0.5rem 0 0;
      font-size: clamp(1.25rem, 2vw, 1.75rem);
      color: #ffffff;
    }
    .counter {
      flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      padding: 0.55rem 1rem;
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
    }

    .quote-card {
      overflow: hidden;
      border-radius: 2rem;
      border: 1px solid rgba(255,255,255,0.16);
      background: #171717;
      box-shadow: 0 24px 80px rgba(0,0,0,0.45);
    }
    .quote-content {
      min-height: 35rem;
      display: flex;
      flex-direction: column;
      padding: clamp(1.5rem, 5vw, 3.5rem);
      opacity: 1;
      transform: translateY(0) scale(1);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .quote-content.fade-out {
      opacity: 0;
      transform: translateY(-14px) scale(0.98);
    }
    .quote-content.fade-in {
      opacity: 0;
      transform: translateY(14px) scale(0.98);
    }

    .quote-icon {
      width: 2.75rem;
      height: 2.75rem;
      color: rgba(255,255,255,0.45);
      margin-bottom: 1.5rem;
      flex-shrink: 0;
    }
    blockquote { flex: 1; margin: 0; }
    blockquote p {
      margin: 0;
      color: #ffffff;
      font-size: clamp(1.6rem, 6.5vw, 5.5rem);
      line-height: 1.04;
      letter-spacing: -0.04em;
      font-weight: 900;
      text-wrap: balance;
    }

    .quote-footer {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255,255,255,0.2);
    }
    .context {
      max-width: 48rem;
      margin: 0;
      color: #e5e5e5;
      font-size: clamp(0.95rem, 1.5vw, 1.1rem);
      line-height: 1.65;
    }
    .source-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
      color: #d4d4d4;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-size: 0.75rem;
      font-weight: 700;
      transition: color 160ms ease, transform 160ms ease;
    }
    .source-link:hover { color: #ffffff; transform: translateY(-1px); }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    .nav-button {
      min-height: 3rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border: 0;
      border-radius: 1rem;
      background: rgba(255,255,255,0.1);
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      transition: background 160ms ease, transform 160ms ease;
    }
    .nav-button:hover { background: rgba(255,255,255,0.16); transform: translateY(-1px); }
    .nav-button:active { transform: translateY(0); }
    .nav-button-light { background: #ffffff; color: #171717; }
    .nav-button-light:hover { background: #e5e5e5; }

    @media (max-width: 700px) {
      .page-shell { padding: 1rem; align-items: stretch; }
      .topbar { align-items: flex-start; }
      .quote-content { min-height: 30rem; }
      .controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

      <article class="quote-card">

            <path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/>
          </svg>
          <blockquote>
            <p id="quoteText"></p>

          <footer class="quote-footer">
            <p class="context" id="quoteContext"></p>
            <a id="quoteSource" href="#" target="_blank" rel="noreferrer" class="source-link">

              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                <polyline points="15 3 21 3 21 9"/>
                <line x1="10" y1="14" x2="21" y2="3"/>

      <nav class="controls" aria-label="Citatos navigacija">

        </button>
      </nav>
    </section>
  </main>

  <script>
    const quotes = [
      { quote: "Vaikų darželio žaidimas: atėjo senelis, liepė susirinkti žaislus ir dabar nežinau, ką toliau darys.", context: "Apie chaosą Seime ir TS-LKD veiksmus po „čekiukų" skandalo.", source: "LRT / ELTA", url: "https://www.lrt.lt/naujienos/lietuvoje/2/2007044/nauseda-chaosa-seime-ir-konservatoriu-partijoje-vadina-vaiku-darzelio-zaidimu-atejo-senelis-ir-liepe-susirinkti-zaislus" },
      { quote: "Aš manau, kad Tėvynės sąjunga-Lietuvos krikščionys demokratai mėgino vėl pastatyti vežimą prieš arklį.", context: "Apie pirmalaikių rinkimų iniciatyvą politinės krizės metu.", source: "LRT / ELTA", url: "https://www.lrt.lt/naujienos/lietuvoje/2/2007044/nauseda-chaosa-seime-ir-konservatoriu-partijoje-vadina-vaiku-darzelio-zaidimu-atejo-senelis-ir-liepe-susirinkti-zaislus" },
      { quote: "Pagaliau reikia prisiimti atsakomybę už tai, ką kalbi viešojoje erdvėje. Kitą kartą geriau tarp keturių sienų pakalbėti ir kad niekas to negirdėtų.", context: "Komentaras apie viešus politinius pasisakymus.", source: "LNK / Kauno diena", url: "https://kauno.diena.lt/naujienos/lietuva/politika/2023-uju-prezidento-perliukai-neplakime-saves-kad-nusprendeme-dar-truputi-pasidazyti-lupas-1155247" },
      { quote: "Pastaruosius 20 metų pasakų nebeskaitau. Kažkada dukroms skaitydavau, dabar nebeskaitau.", context: "Atsakymas į žurnalistų klausimą apie politinius „pasakojimus".", source: "LNK / Kauno diena", url: "https://kauno.diena.lt/naujienos/lietuva/politika/2023-uju-prezidento-perliukai-neplakime-saves-kad-nusprendeme-dar-truputi-pasidazyti-lupas-1155247" },
      { quote: "O, Dieve mano, tai tikrai didelė naujiena. Tikiuosi, kad tie, kurie kalti, bus nubausti.", context: "Reakcija į vieną iš 2023 m. politinių skandalų.", source: "LNK / Kauno diena", url: "https://kauno.diena.lt/naujienos/lietuva/politika/2023-uju-prezidento-perliukai-neplakime-saves-kad-nusprendeme-dar-truputi-pasidazyti-lupas-1155247" },
      { quote: "Galima mėginti nuimti mažesnę galvą tam, kad būtų išsaugota didesnė. Klausimai yra poniai Armonaitei.", context: "Apie atsakomybės perkėlimą politinėje krizėje.", source: "LNK / Kauno diena", url: "https://kauno.diena.lt/naujienos/lietuva/politika/2023-uju-prezidento-perliukai-neplakime-saves-kad-nusprendeme-dar-truputi-pasidazyti-lupas-1155247" },
      { quote: "Vėl esame priversti stebėti naujųjų, kad ir kitomis spalvomis pasidabinusių, bebrų atgimimą, savotišką neobebrystės reiškinį.", context: "Apie politinį protekcionizmą ir „bebrų" metaforą.", source: "LNK / Kauno diena", url: "https://kauno.diena.lt/naujienos/lietuva/politika/2023-uju-prezidento-perliukai-neplakime-saves-kad-nusprendeme-dar-truputi-pasidazyti-lupas-1155247" },
      { quote: "Na, džiaugiuosi, kad žolės dažyti nereikia, nes lietus pasirūpino tuo, kad Vilnius ir visa Lietuva tampa vėl natūraliai žalia.", context: "Apie pasiruošimą NATO viršūnių susitikimui Vilniuje.", source: "LNK / Kauno diena", url: "https://kauno.diena.lt/naujienos/lietuva/politika/2023-uju-prezidento-perliukai-neplakime-saves-kad-nusprendeme-dar-truputi-pasidazyti-lupas-1155247" },
      { quote: "Neplakime savęs, kad nusprendėme truputį dar lūpas pasidažyti prieš renginį.", context: "Apie Vilniaus pasiruošimą NATO viršūnių susitikimui.", source: "LNK / Kauno diena", url: "https://kauno.diena.lt/naujienos/lietuva/politika/2023-uju-prezidento-perliukai-neplakime-saves-kad-nusprendeme-dar-truputi-pasidazyti-lupas-1155247" },
      { quote: "Jūs norite, kad aš su bizūnėliu Seimą ginčiau greičiau įstatymą priimti?", context: "Apie prezidento spaudimą Seimui priimti įstatymus.", source: "LNK / Kauno diena", url: "https://kauno.diena.lt/naujienos/lietuva/politika/2023-uju-prezidento-perliukai-neplakime-saves-kad-nusprendeme-dar-truputi-pasidazyti-lupas-1155247" },
      { quote: "Staiga spalvos labai sutirštinamos. Siūlyčiau tiesiog užsienio reikalų ministrui atsisėsti ir nusiraminti.", context: "Apie įtampas su užsienio reikalų ministru.", source: "LNK / Kauno diena", url: "https://kauno.diena.lt/naujienos/lietuva/politika/2023-uju-prezidento-perliukai-neplakime-saves-kad-nusprendeme-dar-truputi-pasidazyti-lupas-1155247" },
      { quote: "Jeigu yra imitacija ir norima pasirūpinti parašiutais, tai mes čia parašiutų nesiuvame Prezidentūroje. Yra galbūt karinėse bazėse užsilikę ar dar kur nors.", context: "Apie ambasadorių atranką ir galimus „parašiutus".", source: "LNK / Kauno diena", url: "https://kauno.diena.lt/naujienos/lietuva/politika/2023-uju-prezidento-perliukai-neplakime-saves-kad-nusprendeme-dar-truputi-pasidazyti-lupas-1155247" },
      { quote: "Konstitucijos 38 straipsnio turinys neturi būti išplaunamas per užpakalines duris.", context: "Apie Civilinės sąjungos įstatymą.", source: "LRT / ELTA", url: "https://www.lrt.lt/naujienos/lietuvoje/2/2084839/nauseda-nesigaili-pasipiktinima-sukelusiu-pareiskimu-del-civilines-sajungos-jokiu-kitu-minciu-neturejau" },
      { quote: "Jeigu kažkieno fantazija šiuo klausimu vaizdingesnė, galbūt pamato daugiau negu reikia, tačiau metaforų savo kalboje neketinu atsisakyti.", context: "Po reakcijų į „užpakalinių durų" metaforą.", source: "LRT / ELTA", url: "https://www.lrt.lt/naujienos/lietuvoje/2/2084839/nauseda-nesigaili-pasipiktinima-sukelusiu-pareiskimu-del-civilines-sajungos-jokiu-kitu-minciu-neturejau" },
      { quote: "Pačių Vakarų bendruomenių mėginimai pro užpakalines duris įvesti Rusijos ir Baltarusijos sportininkus į tarptautinę areną.", context: "Apie Rusijos ir Baltarusijos sportininkų grąžinimą į tarptautines varžybas.", source: "LNK / Kauno diena", url: "https://kauno.diena.lt/naujienos/lietuva/politika/2023-uju-prezidento-perliukai-neplakime-saves-kad-nusprendeme-dar-truputi-pasidazyti-lupas-1155247" },
      { quote: "Mes, politikai, turėtume sutrumpinti savo kalbas, kad statybos greičiau vyktų.", context: "Viešame renginyje apie statybų eigą.", source: "LNK / Kauno diena", url: "https://kauno.diena.lt/naujienos/lietuva/politika/2023-uju-prezidento-perliukai-neplakime-saves-kad-nusprendeme-dar-truputi-pasidazyti-lupas-1155247" },
      { quote: "Kartais man atrodo, kad konservatoriai reikalauja išsirengti žmogų prieš juos, kad jis įrodytų savo neteisumą.", context: "2024 m. frazė apie konservatorius.", source: "LNK / Kauno diena", url: "https://kauno.diena.lt/naujienos/lietuva/politika/politiku-perliukai-2024-aisiais-apie-sanitarus-braskes-ir-valkatas-1206174" },
      { quote: "Ši partija turbūt gulasi ir keliasi galvodama apie mane.", context: "Apie konservatorių dėmesį prezidentui.", source: "LNK / Kauno diena", url: "https://kauno.diena.lt/naujienos/lietuva/politika/politiku-perliukai-2024-aisiais-apie-sanitarus-braskes-ir-valkatas-1206174" },
      { quote: "Konservatoriai dažnai turi suvokimo problemą. Sakyčiau, dirbkite su literatūra, su tam tikromis disciplinomis.", context: "Atsakas konservatoriams dėl prezidento pozicijų.", source: "LNK / Kauno diena", url: "https://kauno.diena.lt/naujienos/lietuva/politika/politiku-perliukai-2024-aisiais-apie-sanitarus-braskes-ir-valkatas-1206174" },
      { quote: "Mano, kaip prezidento, vaidmuo bus, sakyčiau, sanitarinis, jeigu galima taip pavadinti.", context: "Apie prezidento vaidmenį formuojant Vyriausybę.", source: "LNK / Kauno diena", url: "https://kauno.diena.lt/naujienos/lietuva/politika/politiku-perliukai-2024-aisiais-apie-sanitarus-braskes-ir-valkatas-1206174" },
      { quote: "Jeigu norima sėti sumaištį visuomenėje arba trolinti visus aplinkui – galima ir antilopę pasiūlyti į ministro pareigas.", context: "Apie „Nemuno aušros" siūlomas ministrų kandidatūras.", source: "LRT / ELTA", url: "https://www.lrt.lt/naujienos/lietuvoje/2/2681245/nauseda-atsake-zemaitaiciui-norint-seti-sumaisti-i-ministrus-galima-pasiulyti-ir-antilope" },
      { quote: "Visas šitas vaikų žaidimas smėlio dėžėje vykdomas dėl labai paprastos priežasties – ši partija arba žmonių grupė tiesiog neturi kandidatų, kurių pasiūlymas nesukeltų šypsenos arba neverstų stvertis už galvos.", context: "Apie „Nemuno aušros" ministrų kandidatūrų siūlymus ir politinį trolinimą formuojant Vyriausybę.", source: "LRT / ELTA", url: "https://www.lrt.lt/naujienos/lietuvoje/2/2681245/nauseda-atsake-zemaitaiciui-norint-seti-sumaisti-i-ministrus-galima-pasiulyti-ir-antilope" },
      { quote: "Aš ne mokytojas ir ne kažkoks pamokslautojas socialdemokratams. Kartais nusistebiu, kokia milžiniška yra socialdemokratų kantrybė.", context: "Apie socialdemokratų laikyseną koalicijoje.", source: "LRT / ELTA", url: "https://www.lrt.lt/naujienos/lietuvoje/2/2681245/nauseda-atsake-zemaitaiciui-norint-seti-sumaisti-i-ministrus-galima-pasiulyti-ir-antilope" },
      { quote: "Tikrai nenorėčiau būti vaikų darželio auklėtojas ir nurodinėti, su kuo reikia draugauti, o su kuo ne.", context: "Apie tai, ar prezidentas kišis į koalicijos santykius.", source: "LRT / BNS", url: "https://www.lrt.lt/naujienos/lietuvoje/2/2705489/nauseda-neketina-kistis-i-koalicijos-reikalus-nenoreciau-buti-darzelio-aukletoju" },
      { quote: "Pati politinė partija turi įvertinti, kaip ir vaikas, kuris draugauja su kitu vaiku, kuris jį skriaudžia arba atiminėja pinigus, tėvų duotus.", context: "Apie prezidento nenorą kištis į koalicijos santykius ir politinių partijų tarpusavio „draugystes".", source: "LRT / BNS", url: "https://www.lrt.lt/naujienos/lietuvoje/2/2705489/nauseda-neketina-kistis-i-koalicijos-reikalus-nenoreciau-buti-darzelio-aukletoju" },
      { quote: "Tai truputį panašu į nabašnyko pašlakstymą žaliąja arbata.", context: "Apie siūlomą PVM lengvatą šildymui.", source: "LRT", url: "https://www.lrt.lt/naujienos/verslas/4/1599285/nauseda-apie-valdzios-siuloma-pvm-lengvata-uz-sildyma-tai-panasu-i-nabasnyko-paslakstyma" },
      { quote: "Pagal nesudėtingus paskaičiavimus, padės sutaupyti 5–6 eurus. Jei su tokia žinute norime nueiti ir pasakyti, kiek daug padarėme žmonių labui, tai geriau jau gal neikime.", context: "Apie valdžios siūlytą PVM lengvatą šildymui ir jos menką praktinį poveikį žmonėms.", source: "LRT", url: "https://www.lrt.lt/naujienos/verslas/4/1599285/nauseda-apie-valdzios-siuloma-pvm-lengvata-uz-sildyma-tai-panasu-i-nabasnyko-paslakstyma" },
      { quote: "Kartais metafora padeda, bet kartais yra labai plona riba – kai jas mėtai į dešinę ir į kairę, jos praranda skonį.", context: "Knygos pristatyme apie savo metaforas.", source: "LRT", url: "https://www.lrt.lt/naujienos/lietuvoje/2/2501418/nausedos-knygos-pristatyme-vaikystes-isdaigos-garsiosios-metaforos-ir-laimes-akimirkos" },
      { quote: "Metaforos tikslas – padėti geriau suprasti mintį, kurią nori pasakyti.", context: "Knygos pristatyme apie savo viešąją retoriką ir metaforų naudojimą politikoje.", source: "LRT", url: "https://www.lrt.lt/naujienos/lietuvoje/2/2501418/nausedos-knygos-pristatyme-vaikystes-isdaigos-garsiosios-metaforos-ir-laimes-akimirkos" },
      { quote: "Sėdėti mašinoje, vairuoti ją pačiam, kas dabar neįmanoma. Visos problemos išgaruoja, lieki tik tu, nepažinti vaizdai už posūkio – va, čia yra laimė.", context: "Apie keliones ir vairavimą.", source: "LRT", url: "https://www.lrt.lt/naujienos/lietuvoje/2/2501418/nausedos-knygos-pristatyme-vaikystes-isdaigos-garsiosios-metaforos-ir-laimes-akimirkos" },
      { quote: "Taip, kaip D. Trumpas, aš nepretenduoju į trečią kadenciją. Dabar tos kelionės nebe kelionės.", context: "Knygos pristatymo epizodas apie keliones ir prezidentavimą.", source: "LRT", url: "https://www.lrt.lt/naujienos/lietuvoje/2/2501418/nausedos-knygos-pristatyme-vaikystes-isdaigos-garsiosios-metaforos-ir-laimes-akimirkos" },
    ];

    let current = 0;
    const content = document.getElementById("quoteContent");
    const counterEl = document.getElementById("counter");

    function render(index) {
      const q = quotes[index];
      document.getElementById(“quoteText”).textContent = '„' + q.quote + '“';
      document.getElementById(“quoteContext”).textContent = q.context;
      document.getElementById(“quoteSourceText”).textContent = 'Saltinis: ' + q.source;
      document.getElementById(“quoteSource”).href = q.url;
      counterEl.textContent = (index + 1) + ' / ' + quotes.length;
    }

    function transition(newIndex) {
      content.classList.add("fade-out");
      setTimeout(() => {
        current = newIndex;
        render(current);
        content.classList.remove("fade-out");
        content.classList.add("fade-in");
        requestAnimationFrame(() => requestAnimationFrame(() => {
          content.classList.remove("fade-in");
        }));
      }, 220);
    }

    document.getElementById("btnNext").onclick = () =>
      transition((current + 1) % quotes.length);

    document.getElementById("btnPrev").onclick = () =>
      transition((current - 1 + quotes.length) % quotes.length);

    document.getElementById("btnRandom").onclick = () => {
      let next = current;
      while (next === current) next = Math.floor(Math.random() * quotes.length);
      transition(next);
    };

    render(0);
  </script>
</body>
</html>
